[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sahi-rs"
version = "0.1.0"
description = "Fast SAHI (Slicing Aided Hyper Inference) implementation in Rust"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
keywords = ["sahi", "object-detection", "yolo", "slicing", "inference"]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pillow>=9.0",
    "ruff>=0.1.0",
]
torch = [
    "torch>=2.0",
]
models = [
    "ultralytics>=8.0",
]
cv = [
    "opencv-python>=4.0",
]
full = [
    "torch>=2.0",
    "ultralytics>=8.0",
    "opencv-python>=4.0",
    "pillow>=9.0",
]

[tool.maturin]
features = ["python", "models"]
module-name = "sahi_rs"

# Build with ONNX support by default
# For CUDA support: maturin build --features python,models-cuda
# For TensorRT: maturin build --features python,models-tensorrt

[tool.ruff]
target-version = "py38"
line-length = 88
src = ["python"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip strict
    "SIM105", # suppressible exception
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["sahi"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
